<svg xmlns="http://www.w3.org/2000/svg" width="320" height="104" viewBox="0 0 320 104" role="img" aria-label="Bit and Bytes LLC">
  <defs>
    <style><![CDATA[
      .card {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1;
      }
      .logo-dark { display: block; }
      .logo-light { display: none; }
      @media (prefers-color-scheme: light) {
        .card {
          fill: #ffffff;
          stroke: #d0d7de;
        }
        .logo-dark { display: none; }
        .logo-light { display: block; }
      }
    ]]></style>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="319" height="103" rx="20" ry="20"/>
  <image class="logo-dark" href="data:image/webp;base64," x="32" y="17" width="256" height="70" preserveAspectRatio="xMidYMid meet"/>
  <image class="logo-light" href="data:image/webp;base64," x="32" y="17" width="256" height="70" preserveAspectRatio="xMidYMid meet"/>
</svg>
